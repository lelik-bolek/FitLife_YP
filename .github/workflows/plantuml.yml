name: PlantUML Diagrams

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'   # не запускать от бота
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '11'
      - name: Install PlantUML
        run: sudo apt-get update && sudo apt-get install -y plantuml
      - name: Generate PNGs
        run: |
          find diagrams -name "*.puml" -exec plantuml -tpng {} \;
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagrams/**/*.png
          git diff --staged --quiet || (git commit -m "Auto-generate diagrams [skip ci]" && git push)
